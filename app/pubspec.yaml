name: vrijdag
description: Vrijdag — a calendar that knows what the day has to offer.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  posthog_flutter: ^4.11.0
  google_fonts: ^6.2.1
  crypto: ^3.0.6
  sign_in_with_apple: ^6.1.4
  uuid: ^4.5.1
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_timezone: ^4.1.0
  sentry_flutter: ^8.14.0
  supabase_flutter: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0

flutter:
  generate: true
  uses-material-design: true
